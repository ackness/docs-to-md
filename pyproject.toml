[project]
name = "docs-to-md"
version = "0.2.0"
description = "Convert ReadTheDocs-style documentation sites to Markdown"
authors = [{ name = "ackness", email = "ackness8@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "openai>=1.50.0",
    "lxml>=5.3.0",
    "markdownify>=1.0.0",
]

[project.scripts]
d2m = "docs_to_md.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["docs_to_md"]
